name: GruxPhone
options:
  bundleIdPrefix: com.dcj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Your Apple Developer team id, required for signing so the app can deploy
    # to a physical iPhone. Automatic signing lets xcodebuild fetch a development
    # provisioning profile that includes the paired device UDID.
    #
    # Read from the environment rather than compiled in, so no one person's
    # developer account is baked into the repo:
    #
    #   export GRUX_TEAM_ID=XXXXXXXXXX && xcodegen
    #
    # Unset yields an empty team, which fails signing with Xcode's own "no team
    # selected" error rather than silently signing under a stranger's account.
    # Passing DEVELOPMENT_TEAM=... to xcodebuild overrides this either way, which
    # is what the documented build command in Grux-Mac/CLAUDE.md does.
    DEVELOPMENT_TEAM: ${GRUX_TEAM_ID}

targets:
  GruxPhone:
    type: application
    platform: iOS
    sources:
      - path: GruxPhone
        excludes:
          - "Preview Content/**"
          - "GruxPhone.entitlements"
          - "Info.plist"
      - path: GruxPhone/Preview Content
        buildPhase: resources
    resources:
      - path: GruxPhone/Assets.xcassets
    info:
      path: GruxPhone/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Grux Phone
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # `location` is deliberately NOT declared. The wire protocol defines frame
        # 0x11 LOCATION and LocationPayload on both sides, and LocationService
        # exists, but NOTHING calls it: no authorization is ever requested and
        # startUpdatingLocation is never reached, which the service itself records
        # with `allowsBackgroundLocationUpdates = false  // opt-in later`.
        #
        # Declaring a background mode the app never uses is an App Store rejection
        # trigger, and in an open source release it is worse than that: a reader
        # opens Info.plist, sees background location with always-authorization, and
        # concludes the app tracks them. It does not. The declaration was false in
        # the frightening direction.
        #
        # Re-add this and the two NSLocation* strings together in the change that
        # actually wires the service up. Removing the strings makes that failure
        # loud: iOS traps immediately if a permission is requested without one.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Grux Phone captures your voice so your Mac can transcribe and remember what you said while you were out."
        NSCameraUsageDescription: "Used only to scan the pairing QR code shown on your Mac. The camera is never recorded."
        NSLocalNetworkUsageDescription: "Finds your Mac on the same Wi-Fi so the two can talk directly. No audio ever leaves your LAN."
        NSBonjourServices:
          - _grux-phone._tcp
          - _grux-phone._tcp.local
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GruxPhone/GruxPhone.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcj.gruxphone
        PRODUCT_NAME: GruxPhone
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${GRUX_TEAM_ID}
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"GruxPhone/Preview Content"'
        ENABLE_PREVIEWS: "YES"
